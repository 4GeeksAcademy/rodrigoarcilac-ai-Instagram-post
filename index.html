<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Publicación de Instagram</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <article class="post">
      <div class="post-header">
        <div class="profile-picture" aria-label="Foto de perfil"></div>
        <div class="user-meta">
          <p class="user-name">Robert Hare</p>
          <p class="user-location">Altadena California</p>
        </div>
      </div>
      <div>
        <img
          class="post-image"
          src="https://picsum.photos/200/300"
          alt="Imagen de publicación"
          width="200"
          height="300"
        />
      </div>
      <div class="post-actions">
        <div class="actions-left">
          <button class="action-button" type="button" aria-label="Like"><i class="fa-regular fa-heart"></i></button>
          <button class="action-button" type="button" aria-label="Comentario"><i class="fa-regular fa-comment"></i></button>
          <button class="action-button" type="button" aria-label="Compartir"><i class="fa-regular fa-paper-plane"></i></button>
        </div>
        <button class="action-button" type="button" aria-label="Guardar"><i class="fa-regular fa-bookmark"></i></button>
      </div>
      <div>
        <p class="likes-count">1,248 likes</p>
      </div>
      <div>
        <p class="post-caption"><strong>Robert Hare</strong> lorem ipsum dolr sit amet <span class="hashtags">#augue, #adipiscing,#elit,#do,#eiusmod#tempor</span></p>
      </div>
    </article>
  </body>
</html>
